name: Build & Publish Android App to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play release track (production, internal, alpha, beta)"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta
      release_status:
        description: "Release status (completed, draft, inProgress)"
        required: true
        default: "completed"
        type: choice
        options:
          - completed
          - draft
          - inProgress

jobs:
  build-and-publish:
    name: Build AAB & Publish to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release Bundle (AAB) & APK
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnc-android-free-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnc-android-free-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Check for Google Play Credentials
        id: check-creds
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$PLAY_KEY" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
            echo "PLAY_SERVICE_ACCOUNT_KEY secret found."
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "Notice: PLAY_SERVICE_ACCOUNT_KEY secret not found."
          fi

      - name: Setup Python
        if: steps.check-creds.outputs.has_secret == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Publisher API Dependencies
        if: steps.check-creds.outputs.has_secret == 'true'
        run: pip install google-api-python-client google-auth

      - name: Publish AAB & Store Listings to Google Play
        if: steps.check-creds.outputs.has_secret == 'true'
        env:
          PLAY_KEY_CONTENT: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$PLAY_KEY_CONTENT" > /tmp/play-key.json
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "Found release bundle: $AAB_FILE"
          python3 publish_play_store.py \
            --key /tmp/play-key.json \
            --package com.vncandroid.free \
            --bundle "$AAB_FILE" \
            --track "${{ github.event.inputs.track || 'production' }}" \
            --status "${{ github.event.inputs.release_status || 'completed' }}" \
            --metadata-dir metadata
          rm -f /tmp/play-key.json
